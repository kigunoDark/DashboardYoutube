<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUKA Admin — Управление конкурентами</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center">
                    <i class="fas fa-cog text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl">BUKA Admin</h1>
                    <p class="text-gray-400 text-sm">Управление конкурентами</p>
                </div>
            </div>
            <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition">
                <i class="fas fa-arrow-left mr-2"></i>Назад к дашборду
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Add Form -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-6">
            <h2 class="font-bold text-lg mb-4"><i class="fas fa-plus-circle mr-2 text-orange-400"></i>Добавить конкурента</h2>
            <form id="addForm" class="flex gap-3 flex-wrap">
                <input type="text" id="channelUrl" placeholder="https://www.youtube.com/@channel или /channel/ID" required
                       class="flex-1 min-w-[300px] bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500">
                <button type="submit" class="bg-orange-500 hover:bg-orange-600 px-6 py-3 rounded-lg font-medium transition whitespace-nowrap">
                    <i class="fas fa-plus mr-2"></i>Добавить
                </button>
            </form>
            <p class="text-xs text-gray-500 mt-2">Поддерживаются: <code class="bg-gray-700 px-1 rounded">/channel/UC...</code>, <code class="bg-gray-700 px-1 rounded">/@handle</code>, <code class="bg-gray-700 px-1 rounded">/c/name</code>, <code class="bg-gray-700 px-1 rounded">/user/name</code></p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
                <div class="text-gray-400 text-sm mb-1">Всего конкурентов</div>
                <div id="totalCompetitors" class="text-3xl font-bold">0</div>
            </div>
            <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
                <div class="text-gray-400 text-sm mb-1">Активных</div>
                <div id="activeCompetitors" class="text-3xl font-bold text-green-400">0</div>
            </div>
            <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
                <div class="text-gray-400 text-sm mb-1">Неактивных</div>
                <div id="inactiveCompetitors" class="text-3xl font-bold text-gray-400">0</div>
            </div>
        </div>

        <!-- Competitors List -->
        <div class="bg-gray-800 rounded-xl border border-gray-700">
            <div class="p-5 border-b border-gray-700 flex items-center justify-between flex-wrap gap-3">
                <h2 class="font-bold"><i class="fas fa-list mr-2"></i>Список конкурентов</h2>
                <div class="flex gap-2">
                    <button onclick="selectAll(true)" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">Все активны</button>
                    <button onclick="selectAll(false)" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">Все неактивны</button>
                    <button onclick="exportToConfig()" class="text-sm bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded transition">
                        <i class="fas fa-download mr-1"></i>config.json
                    </button>
                </div>
            </div>
            <div id="competitorsList" class="divide-y divide-gray-700">
                <!-- Dynamic content -->
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="mt-6 text-center">
            <button onclick="clearAll()" class="text-sm text-red-400 hover:text-red-300 transition">
                <i class="fas fa-trash mr-1"></i>Очистить весь список
            </button>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
